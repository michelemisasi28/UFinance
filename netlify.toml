# Netlify pubblica la PWA (cartella app/) così com'è: nessuna compilazione.
[build]
  publish = "app"
  # Nessuna compilazione: la PWA si pubblica così com'è.
  # Il comando è esplicito per sostituire quello rimasto salvato nelle impostazioni del sito su Netlify.
  command = "echo 'Nessuna compilazione: pubblico la cartella app/'"
  # Crediti Netlify (piano Free: 300/mese, 15 per ogni pubblicazione in produzione): se il commit non cambia app/
  # la build viene annullata e non si pubblica nulla. https://docs.netlify.com/build/configure-builds/ignore-builds/
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF app/"

# HTML, service worker e manifest vanno sempre ricontrollati: gli aggiornamenti arrivano subito.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
