# Netlify pubblica la PWA (cartella app/) così com'è: nessuna compilazione.
[build]
  publish = "app"

# HTML, service worker e manifest vanno sempre ricontrollati: gli aggiornamenti arrivano subito.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
