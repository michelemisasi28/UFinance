# Netlify pubblica la PWA (cartella app/) così com'è: nessuna compilazione.
[build]
  publish = "app"
  # Nessuna compilazione: la PWA si pubblica così com'è.
  # Il comando è esplicito per sostituire quello rimasto salvato nelle impostazioni del sito su Netlify.
  command = "echo 'Nessuna compilazione: pubblico la cartella app/'"
  # Crediti Netlify (piano Free: 300/mese, 15 per ogni pubblicazione in produzione): se il commit non cambia app/
  # la build viene annullata e non si pubblica nulla. https://docs.netlify.com/build/configure-builds/ignore-builds/
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF app/"

# HTML, service worker e manifest vanno sempre ricontrollati: gli aggiornamenti arrivano subito.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Difesa in profondità: l'app carica solo i propri file, parla solo con CoinGecko e non può essere incorporata
    # in altre pagine. L'impronta sha256 è quella dello script in linea di index.html (tema all'avvio):
    # la aggiorna tools/stamp.js, non modificarla a mano. https://developer.mozilla.org/docs/Web/HTTP/CSP
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-sBTFwd68k9mivMKIdZizorh7JKimWUAaKLv77bpn5LY='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.coingecko.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"
